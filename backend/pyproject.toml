[project]
name = "inventorymantra-backend"
version = "0.1.0"
description = "InventoryMantra API and LangGraph agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "tzdata>=2026.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "psycopg-pool>=3.2",
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langsmith>=0.4",
    "jsonpatch>=1.33",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false
# The repo lives in OneDrive, which rejects hardlinks (os error 396); copy instead.
link-mode = "copy"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
# Migrations build DDL from module constants only (no external input).
"app/db/migrations/**" = ["S608"]
# Prompt text is verbatim from docs/PROMPTS.md (approved); wrapping it would change the prompt.
"app/agent/prompts/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
