# Local development database only. Credentials are dev defaults for a localhost-bound
# container; override via POSTGRES_* in .env. Never reuse these anywhere else.
services:
  db:
    image: postgres:16-alpine
    container_name: inventorymantra-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventorymantra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventorymantra_dev}
      POSTGRES_DB: ${POSTGRES_DB:-inventorymantra}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
